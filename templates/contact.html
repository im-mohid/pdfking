{% extends "base.html" %}{% block content %}
<div class="max-w-xl mx-auto card !p-8"><h1 class="text-2xl font-bold mb-4">Support & contact</h1>
<form method="post" action="/contact" class="space-y-3"><input name="email" type="email" required placeholder="Your email" value="{{ user.email if user }}" class="inp"><input name="subject" required placeholder="Subject (e.g. Upgrade to Pro)" class="inp"><textarea name="message" required rows="6" placeholder="How can we help?" class="inp"></textarea><button class="btn">Send</button></form></div>{% endblock %}
