<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pdfkit · PDF workbench</title>
<meta name="description" content="Extract tables, OCR Bengali, redact PII, diff, compress and batch-process PDFs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2318160f'/%3E%3Cpath d='M9 6h9l6 6v14H9z' fill='%23f2eee3'/%3E%3Cpath d='M18 6v6h6' fill='%23d9481c'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--paper:#f2eee3;--card:#fbf9f3;--ink:#18160f;--mute:#6d675a;--ember:#d9481c;--moss:#2f6b4f}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  background-image:radial-gradient(rgba(24,22,15,.09) 1px,transparent 1px);background-size:20px 20px}
.mono,.lbl,small,th,.stat span,.drop-s,.slot-l,.chip,.btn,.prog p,.cmp .row,.foot{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.shell{max-width:1180px;margin:0 auto;padding:0 20px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:26px 0 14px;border-bottom:3px solid var(--ink);margin-bottom:28px}
.brand{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--ink);text-decoration:none;line-height:1}
.brand span{color:var(--ember)}.brand small{margin-left:10px;font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.quota{font-size:12px;border:2px solid var(--ink);padding:3px 10px;background:var(--card)}
.rail{display:flex;flex-direction:column;gap:8px}
.tab{all:unset;cursor:pointer;display:grid;grid-template-columns:38px 1fr;align-items:baseline;padding:10px 12px;border:2px solid transparent}
.tab:hover{border-color:var(--ink)}
.tab:focus-visible,.drop:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.tab .n{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
.tab b{display:block;font-size:16px;line-height:1.2}.tab small{color:var(--mute);font-size:11px}
.tab[aria-current=true]{background:var(--ink);color:var(--paper);box-shadow:5px 5px 0 var(--ember)}
.tab[aria-current=true] .n,.tab[aria-current=true] small{color:#c9c3b2}
@media(max-width:1023px){.rail{flex-direction:row;overflow-x:auto;padding-bottom:8px}.tab{min-width:168px}}
.card{background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:22px}
.card+.card{margin-top:26px}
.card-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
.num{font-size:60px;line-height:.9;font-weight:800;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.card-head h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.15}.card-head p{margin:6px 0 0;color:var(--mute);max-width:60ch}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.slot-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:136px;padding:18px;text-align:center;cursor:pointer;
  border:2px dashed var(--ink);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(24,22,15,.04) 10px 20px);transition:.15s}
.drop:hover,.drop.over{background-color:#f7dccd;border-style:solid}
.drop-t{font-size:19px;font-weight:700}.drop-s{font-size:12px;color:var(--mute)}
.flist{list-style:none;margin:8px 0 0;padding:0}
.flist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 10px;margin-bottom:4px;border:1px solid var(--ink);background:#fff;font-size:13px}
.flist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.flist em{font-style:normal;color:var(--mute);margin-left:8px;font-size:12px}
.flist button{all:unset;cursor:pointer;color:var(--ember);font-weight:800;padding:0 4px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.fld[hidden]{display:none}.fld.wide{grid-column:1/-1}
.fld>label,.fld>.lbl{display:block;margin-bottom:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;border:2px solid var(--ink);border-radius:0;background:#fff;padding:8px 10px;font:inherit;color:var(--ink)}
.fld input[type=color]{width:64px;height:38px;border:2px solid var(--ink);padding:2px;background:#fff}
.fld textarea{min-height:78px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid var(--ember);outline-offset:1px}
.hint{display:block;margin-top:4px;font-size:12px;color:var(--mute)}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;line-height:1.35}.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--ember)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:5px 11px;border:2px solid var(--ink);background:#fff;font-size:12px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.actions{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;gap:8px;align-items:center;cursor:pointer;background:var(--ember);color:#fff;border:2px solid var(--ink);padding:10px 18px;font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.55;cursor:wait;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink)}.btn i{font-style:normal;font-weight:400;opacity:.8;font-size:12px}
.prog{margin-top:20px}.bar{height:14px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ember);transition:width .25s}
.bar.ind>i{width:35%;animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:65%}}
.prog p{margin:6px 0 0;font-size:12px}
.err{margin-top:18px;border:2px solid var(--ember);background:#fde9e1;padding:10px 14px;font-size:14px}
.res h2{margin:0 0 4px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{border:2px solid var(--ink);background:#fff;padding:10px 12px}.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tw{overflow:auto;max-height:280px;border:2px solid var(--ink);margin-top:8px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 10px;text-align:left;border-bottom:1px solid rgba(24,22,15,.2)}
th{position:sticky;top:0;background:var(--card);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.dl{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
.warn{margin:12px 0 0;padding-left:18px;color:#8a4b00;font-size:13px}
.cmp{display:grid;gap:10px;margin:14px 0}.cmp .row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:12px}
.cmp .b{height:22px;border:2px solid var(--ink);background:#fff}.cmp .b>i{display:block;height:100%;background:var(--ink)}.cmp .new .b>i{background:var(--moss)}
.big{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1}.verdict{margin:6px 0 0;color:var(--mute)}
.samples{margin:10px 0 0;padding:0;list-style:none;font:12.5px ui-monospace,Menlo,monospace}.samples li{padding:4px 8px;border-left:4px solid var(--ink);background:#fff;margin-bottom:4px}
.foot{margin-top:40px;padding-top:12px;border-top:2px solid var(--ink);font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#tables"><span>pdf</span>kit<small>workbench</small></a>
    <div class="quota" id="quota">free tier</div>
  </header>
  <div class="grid gap-8 lg:grid-cols-[236px_1fr]">
    <nav class="rail" id="rail" aria-label="Tools"></nav>
    <main id="bench" aria-live="polite"></main>
  </div>
  <footer class="foot"><span id="ttl">Uploads are deleted automatically.</span><span>Large files are processed page by page.</span></footer>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const PII = {email:'Email', bd_phone:'BD phone', intl_phone:'Intl phone', credit_card:'Credit card', nid:'NID'};
let CFG = {max_file_mb: 25, max_batch_files: 10, pii_types: Object.keys(PII), free_daily_limit: 0, ttl_minutes: 30};

/* ───────── result renderers ───────── */
const stat = (k, v) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`;
const warns = w => w && w.length ? `<ul class="warn">${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const dlBtn = (f, alt) => `<a class="btn${alt ? ' alt' : ''}" href="${esc(f.url)}" download>${esc(f.name)} <i>${esc(f.size_human)}</i></a>`;
const dl = r => `<div class="dl">${(r.files || []).map(f => dlBtn(f)).join('')}</div>`;
const wrap = (title, body) => `<section class="card res"><h2>${esc(title)}</h2>${body}</section>`;
const pg = p => Array.isArray(p) ? p.join(', ') : p;
const table = (head, rows) => rows.length ? `<div class="tw"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : '';

const rTables = r => wrap('Tables extracted',
  `<div class="stats">${stat('tables', r.tables)}${stat('pages scanned', r.pages_scanned)}${stat('stitched', r.stitched)}</div>` +
  table(['Table', 'Pages', 'Size', 'Method'], (r.details || []).slice(0, 80).map(d =>
    `<tr><td>${esc(d.table)}</td><td>${esc(pg(d.pages))}</td><td>${esc(d.rows)} × ${esc(d.cols)}</td><td>${esc(d.method)}</td></tr>`)) +
  warns(r.warnings) + dl(r));

const rOcr = r => wrap('OCR finished',
  `<div class="stats">${stat('pages', r.pages_total)}${stat('OCR’d', r.pages_ocr)}${stat('already text', r.pages_native)}${stat('words', r.words)}${stat('languages', r.langs)}</div>` +
  warns(r.warnings) + dl(r));

const rRedact = r => {
  const bt = Object.entries(r.by_type || {}), max = Math.max(1, ...bt.map(e => e[1]));
  const bars = bt.length ? `<div class="cmp">${bt.map(([k, v]) => `<div class="row"><span>${esc(PII[k] || k)}</span><div class="b"><i style="width:${v / max * 100}%"></i></div><span>${esc(v)}</span></div>`).join('')}</div>` : '';
  const samples = (r.samples || []).slice(0, 12).map(s => `<li>${esc(typeof s === 'object' ? Object.values(s).join(' · ') : s)}</li>`).join('');
  return wrap(r.redactions ? 'Redaction complete' : 'Nothing to redact',
    `<div class="stats">${stat('redactions', r.redactions)}${stat('pages affected', r.pages_affected)}${stat('pages OCR’d', r.ocr_pages)}${stat('mode', r.mode)}</div>` +
    bars + (samples ? `<ul class="samples">${samples}</ul>` : '') + warns(r.warnings) + dl(r));
};

const rCompare = r => wrap('Comparison',
  `<div class="big">${esc(r.similarity)}%</div><p class="verdict">${r.identical ? 'No differences found — the documents match.' : `${esc(r.pages_changed)} of ${esc(r.pages_compared)} page(s) differ.`}</p>` +
  `<div class="stats">${stat('added', r.additions)}${stat('removed', r.deletions)}${stat('changed', r.changes)}${stat('pages A / B', r.pages_a + ' / ' + r.pages_b)}</div>` +
  table(['Page', 'Added', 'Removed', 'Changed'], (r.details || []).slice(0, 120).map(d =>
    `<tr><td>${esc(d.page)}</td><td>${esc(d.added)}</td><td>${esc(d.removed)}</td><td>${esc(d.changed)}</td></tr>`)) +
  warns(r.warnings) + dl(r));

const rCompress = r => {
  const pct = r.original_size ? Math.max(2, r.compressed_size / r.original_size * 100) : 100;
  return wrap('Compressed',
    `<div class="big">−${esc(r.saved_percent)}%</div><p class="verdict">${esc(r.original_human)} → ${esc(r.compressed_human)}</p>` +
    `<div class="cmp"><div class="row"><span>before</span><div class="b"><i style="width:100%"></i></div><span>${esc(r.original_human)}</span></div>` +
    `<div class="row new"><span>after</span><div class="b"><i style="width:${pct}%"></i></div><span>${esc(r.compressed_human)}</span></div></div>` +
    `<div class="stats">${stat('images found', r.images_total)}${stat('recompressed', r.images_recompressed)}${stat('kept as-is', r.images_kept)}${stat('target DPI', r.dpi)}${stat('JPEG quality', r.quality)}</div>` +
    warns(r.warnings) + dl(r));
};

const rBatch = r => {
  const failed = (r.failed || []).map(f => `<li>${esc(f.file)} — ${esc(f.error)}</li>`).join('');
  const list = (r.files || []).slice(0, 40).map(f => dlBtn(f, true)).join('');
  return wrap('Batch finished',
    `<div class="stats">${stat('inputs', r.inputs)}${stat('processed', r.processed)}${stat('failed', (r.failed || []).length)}${stat('output files', (r.files || []).length)}</div>` +
    (failed ? `<ul class="warn">${failed}</ul>` : '') + warns(r.warnings) +
    `<div class="dl">${r.zip ? dlBtn(r.zip) : ''}${list}</div>`);
};

/* ───────── tool definitions ───────── */
const chk = (name, label, def) => ({name, label, type: 'check', def});
const TOOLS = [
 {id:'tables', n:'01', name:'Tables → XLSX', cap:'precision extraction', cta:'Extract tables', render:rTables,
  desc:'Pull tables from every page into Excel. Rows, columns and merged cells are kept; tables that continue across pages are stitched back together.',
  slots:[{key:'file', label:'PDF with tables'}],
  fields:[
   {name:'pages', label:'Pages', type:'text', ph:'e.g. 1-3,5 — blank for all'},
   {name:'layout', label:'Workbook layout', type:'select', def:'sheets', opts:[['sheets','One sheet per table'],['single','All tables on one sheet']]},
   chk('coerce_numbers', 'Convert text numbers to real numbers', true),
   chk('merge_continued', 'Stitch tables that continue across pages', true)]},
 {id:'ocr', n:'02', name:'OCR · English + বাংলা', cap:'searchable PDF', cta:'Run OCR', render:rOcr, async:true,
  desc:'Deskew and denoise scans, then read English and Bengali. Output keeps the original look with an invisible text layer on top.',
  slots:[{key:'file', label:'Scanned PDF'}],
  fields:[
   {name:'langs', label:'Language', type:'select', def:'eng+ben', opts:[['eng+ben','English + Bengali'],['ben','Bengali'],['eng','English']]},
   {name:'pages', label:'Pages', type:'text', ph:'e.g. 1-5 — blank for all'},
   {name:'outputs', label:'Output', type:'chips', def:['pdf'], opts:[['pdf','Searchable PDF'],['txt','Plain text'],['docx','Word']]},
   chk('deskew', 'Straighten crooked pages', true), chk('denoise', 'Remove scan noise', true),
   chk('color', 'Keep colour (bigger file)', false), chk('skip_text_pages', 'Skip pages that already have text', true)]},
 {id:'redact', n:'03', name:'PII Redaction', cap:'text truly removed', cta:'Redact', render:rRedact,
  desc:'Detected text is deleted from the file, not just covered by a box. Bengali digits are understood; card numbers are Luhn-checked.',
  slots:[{key:'file', label:'PDF to redact'}],
  fields:[
   {name:'types', label:'Detect', type:'chips', def:'all', sendEmpty:true, wide:true, opts:() => CFG.pii_types.map(t => [t, PII[t] || t])},
   {name:'custom_regex', label:'Custom pattern (regex)', type:'text', ph:'optional, e.g. INV-\\d{6}'},
   {name:'mode', label:'Style', type:'select', def:'black', opts:[['black','Solid black'],['blur','Blur']]},
   {name:'terms', label:'Extra words to remove', type:'textarea', wide:true, ph:'One per line or comma separated'},
   chk('ocr_scanned', 'OCR scanned pages first so they can be redacted', true)]},
 {id:'compare', n:'04', name:'PDF Diff', cap:'side-by-side', cta:'Compare', render:rCompare,
  desc:'Word-level comparison of two versions. You get an annotated PDF with both pages side by side: green added, red removed, amber changed.',
  slots:[{key:'file_a', label:'Original (A)'}, {key:'file_b', label:'Revised (B)'}],
  fields:[chk('ignore_case', 'Ignore upper / lower case', false), chk('ignore_punct', 'Ignore punctuation', false)]},
 {id:'compress', n:'05', name:'Smart Compress', cap:'before / after', cta:'Compress', render:rCompress,
  desc:'Images are downsampled and recompressed; text and vector graphics stay sharp. If the result would be larger, you get the original back.',
  slots:[{key:'file', label:'PDF to shrink'}],
  fields:[
   {name:'level', label:'Strength', type:'seg', def:'balanced', wide:true, opts:[['light','Light'],['balanced','Balanced'],['strong','Strong']]},
   {name:'image_dpi', label:'Image DPI (optional)', type:'number', min:36, max:600, ph:'auto', hint:'Overrides the preset'},
   {name:'jpeg_quality', label:'JPEG quality (optional)', type:'number', min:10, max:95, ph:'auto'},
   chk('grayscale', 'Convert images to grayscale', false), chk('strip_metadata', 'Remove document metadata', true)]},
 {id:'batch', n:'06', name:'Batch Engine', cap:'many files → ZIP', cta:'Process batch', render:rBatch,
  desc:'Drop several PDFs and convert, merge, split or watermark them in one go. Multiple results arrive as a ZIP.',
  slots:[{key:'files', label:'PDFs', multiple:true}],
  fields:[
   {name:'operation', label:'Operation', type:'seg', def:'convert', wide:true, opts:[['convert','Convert'],['merge','Merge'],['split','Split'],['watermark','Watermark']]},
   {name:'target', label:'Convert to', type:'select', opt:true, def:'images', opts:[['images','Page images'],['txt','Text'],['docx','Word']], show:v => v.operation === 'convert'},
   {name:'format', label:'Image format', type:'select', opt:true, def:'png', opts:[['png','PNG'],['jpg','JPG']], show:v => v.operation === 'convert' && v.target === 'images'},
   {name:'dpi', label:'DPI', type:'number', opt:true, def:150, min:72, max:300, show:v => v.operation === 'convert' && v.target === 'images'},
   {name:'pages', label:'Pages', type:'text', opt:true, ph:'blank for all', show:v => v.operation === 'convert'},
   {name:'name', label:'Merged file name', type:'text', opt:true, ph:'merged', show:v => v.operation === 'merge'},
   {name:'add_bookmarks', label:'Add a bookmark per source file', type:'check', opt:true, def:true, show:v => v.operation === 'merge'},
   {name:'mode', label:'Split mode', type:'select', opt:true, def:'each', opts:[['each','Every page'],['chunks','Every N pages'],['ranges','Custom ranges']], show:v => v.operation === 'split'},
   {name:'chunk_size', label:'Pages per file', type:'number', opt:true, def:10, min:1, max:1000, show:v => v.operation === 'split' && v.mode === 'chunks'},
   {name:'ranges', label:'Ranges', type:'text', opt:true, ph:'1-3,5,7-9 — one file each', show:v => v.operation === 'split' && v.mode === 'ranges'},
   {name:'text', label:'Watermark text', type:'text', opt:true, ph:'CONFIDENTIAL', hint:'Latin characters only', show:v => v.operation === 'watermark'},
   {name:'opacity', label:'Opacity', type:'number', opt:true, def:0.2, min:0.05, max:1, step:0.05, show:v => v.operation === 'watermark'},
   {name:'angle', label:'Angle (°)', type:'number', opt:true, def:45, min:-90, max:90, show:v => v.operation === 'watermark'},
   {name:'fontsize', label:'Font size', type:'number', opt:true, def:48, min:10, max:200, show:v => v.operation === 'watermark'},
   {name:'color', label:'Colour', type:'color', opt:true, def:'#808080', show:v => v.operation === 'watermark'},
   {name:'tile', label:'Repeat across the page', type:'check', opt:true, def:false, show:v => v.operation === 'watermark'}]}
];
const byId = Object.fromEntries(TOOLS.map(t => [t.id, t]));
const S = {};
let cur = null;

/* ───────── rendering ───────── */
function fieldHTML(f, v) {
  const id = 'f_' + f.name, hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  const head = `<div class="fld${f.wide ? ' wide' : ''}" data-f="${f.name}">`;
  if (f.type === 'check') return `${head}<label class="chk"><input type="checkbox" id="${id}" data-n="${f.name}" ${v ? 'checked' : ''}><span>${esc(f.label)}</span></label>${hint}</div>`;
  const lab = `<label for="${id}">${esc(f.label)}</label>`;
  if (f.type === 'select') return `${head}${lab}<select id="${id}" data-n="${f.name}">${f.opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${hint}</div>`;
  if (f.type === 'textarea') return `${head}${lab}<textarea id="${id}" data-n="${f.name}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${hint}</div>`;
  if (f.type === 'chips' || f.type === 'seg') {
    const o = typeof f.opts === 'function' ? f.opts() : f.opts;
    const on = k => f.type === 'seg' ? k === v : (v || []).includes(k);
    return `${head}<span class="lbl">${esc(f.label)}</span><div class="chips" data-chips="${f.name}" data-mode="${f.type}">${o.map(([k, l]) => `<button type="button" class="chip" data-v="${esc(k)}" aria-pressed="${on(k)}">${esc(l)}</button>`).join('')}</div>${hint}</div>`;
  }
  const at = ['min', 'max', 'step'].filter(a => f[a] != null).map(a => `${a}="${f[a]}"`).join(' ');
  return `${head}${lab}<input id="${id}" type="${f.type}" data-n="${f.name}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${at}>${hint}</div>`;
}

function panelHTML(t, st) {
  const slots = t.slots.map(s => `<div class="slot" data-key="${s.key}">
    <div class="slot-l">${esc(s.label)}${s.multiple ? ` · up to ${CFG.max_batch_files}` : ''}</div>
    <label class="drop" tabindex="0"><input class="sr" type="file" accept="application/pdf,.pdf" ${s.multiple ? 'multiple' : ''}>
      <span class="drop-t">Drop ${s.multiple ? 'PDFs' : 'a PDF'} here</span><span class="drop-s">or click to browse · max ${CFG.max_file_mb} MB each</span></label>
    <ul class="flist"></ul></div>`).join('');
  return `<section class="card">
    <div class="card-head"><div class="num">${t.n}</div><div><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p></div></div>
    <div class="slots">${slots}</div>
    <form class="fields" id="opts" onsubmit="return false">${t.fields.map(f => fieldHTML(f, st.vals[f.name])).join('')}</form>
    <div class="actions"><button class="btn" id="run" type="button">${esc(t.cta)}</button><button class="btn alt" id="clear" type="button">Clear</button></div>
    <div class="prog" id="prog" hidden><div class="bar"><i></i></div><p></p></div>
    <div class="err" id="err" role="alert" hidden></div>
  </section><div id="out"></div>`;
}

function paintFiles(t, st) {
  t.slots.forEach(s => {
    const ul = $(`.slot[data-key="${s.key}"] .flist`);
    if (ul) ul.innerHTML = (st.files[s.key] || []).map((f, i) => `<li><span>${esc(f.name)}<em>${fmtSize(f.size)}</em></span><button type="button" data-rm="${i}" aria-label="Remove ${esc(f.name)}">×</button></li>`).join('');
  });
}

function paintStatus(t, st) {
  if (cur !== t.id) return;
  const run = $('#run'); run.disabled = st.busy; run.textContent = st.busy ? 'Working…' : t.cta;
  const p = $('#prog'); p.hidden = !st.prog;
  if (st.prog) { $('.bar', p).classList.toggle('ind', !!st.prog.ind); $('.bar i', p).style.width = st.prog.ind ? '' : st.prog.pct + '%'; $('p', p).textContent = st.prog.label; }
  const e = $('#err'); e.hidden = !st.err; e.textContent = st.err || '';
  $('#out').innerHTML = st.out || '';
}

function applyShow(t, st) {
  t.fields.forEach(f => { if (f.show) { const el = $(`[data-f="${f.name}"]`); if (el) el.hidden = !f.show(st.vals); } });
}

function addFiles(t, st, s, list) {
  const max = CFG.max_file_mb * 1048576, keep = s.multiple ? (st.files[s.key] || []) : [], bad = [];
  for (const f of list) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { bad.push(`${f.name}: not a PDF`); continue; }
    if (f.size > max) { bad.push(`${f.name}: larger than ${CFG.max_file_mb} MB`); continue; }
    if (!f.size) { bad.push(`${f.name}: file is empty`); continue; }
    if (s.multiple) {
      if (keep.length >= CFG.max_batch_files) { bad.push(`Maximum ${CFG.max_batch_files} files per batch`); break; }
      if (!keep.some(x => x.name === f.name && x.size === f.size)) keep.push(f);
    } else { keep[0] = f; break; }
  }
  if (keep.length) st.files[s.key] = keep;
  st.err = bad.length ? bad.join(' · ') : null;
  paintFiles(t, st); paintStatus(t, st);
}

function wire(t, st) {
  t.slots.forEach(s => {
    const el = $(`.slot[data-key="${s.key}"]`), drop = $('.drop', el), inp = $('input', el);
    inp.addEventListener('change', () => { addFiles(t, st, s, inp.files); inp.value = ''; });
    drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => addFiles(t, st, s, e.dataTransfer.files));
    el.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { st.files[s.key].splice(+b.dataset.rm, 1); paintFiles(t, st); } });
  });
  const form = $('#opts');
  form.addEventListener('input', e => {
    const n = e.target.dataset.n; if (!n) return;
    st.vals[n] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    applyShow(t, st);
  });
  form.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const box = c.parentElement, n = box.dataset.chips, v = c.dataset.v;
    if (box.dataset.mode === 'seg') { st.vals[n] = v; box.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c)); }
    else { const set = new Set(st.vals[n]); set.has(v) ? set.delete(v) : set.add(v); st.vals[n] = [...set]; c.setAttribute('aria-pressed', set.has(v)); }
    applyShow(t, st);
  });
  $('#run').addEventListener('click', () => run(t.id));
  $('#clear').addEventListener('click', () => { if (st.busy) return; st.files = {}; st.out = ''; st.err = null; show(t.id); });
}

function show(id) {
  if (!byId[id]) id = 'tables';
  cur = id;
  const t = byId[id], st = S[id];
  $('#bench').innerHTML = panelHTML(t, st);
  wire(t, st); paintFiles(t, st); applyShow(t, st); paintStatus(t, st);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
  document.title = `${t.name} · pdfkit`;
}

/* ───────── networking ───────── */
function parseResp(status, text) {
  let j = null; try { j = JSON.parse(text); } catch (_) {}
  if (!j) throw new Error(status === 413 ? 'The file is too large for the server' : `Server error (${status}). Please try again.`);
  if (status >= 400 || j.ok === false) throw new Error(j.error || (typeof j.detail === 'string' ? j.detail : 'Request failed'));
  return j;
}
function post(url, fd, onUp) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.upload.onprogress = e => { if (e.lengthComputable) onUp(e.loaded / e.total, false); };
    x.upload.onload = () => onUp(1, true);
    x.onload = () => { try { resolve(parseResp(x.status, x.responseText)); } catch (e) { reject(e); } };
    x.onerror = () => reject(new Error('Network error. Check your connection and try again.'));
    x.send(fd);
  });
}
async function poll(id, jobId) {
  let fails = 0;
  for (;;) {
    await sleep(1000);
    let j;
    try { j = await (await fetch(`/api/jobs/${jobId}`, {cache: 'no-store'})).json(); fails = 0; }
    catch (_) { if (++fails > 5) throw new Error('Lost connection to the server'); continue; }
    if (!j.ok) throw new Error(j.error || 'Job not found (it may have expired)');
    if (j.status === 'error') throw new Error(j.error || 'Processing failed');
    if (j.status === 'done') return {job_id: jobId, ...j.result};
    setProg(id, j.percent, j.status === 'queued' ? 'Queued, waiting for a free worker…' : (j.total ? `OCR page ${j.done} of ${j.total}` : 'Preparing pages…'), !j.total);
  }
}
function setProg(id, pct, label, ind) { S[id].prog = {pct, label, ind}; paintStatus(byId[id], S[id]); }

/* ───────── run ───────── */
function validate(t, st) {
  for (const s of t.slots) if (!(st.files[s.key] || []).length) return `Add a PDF to “${s.label}” first.`;
  const v = st.vals;
  if (t.id === 'batch') {
    if (v.operation === 'merge' && st.files.files.length < 2) return 'Merging needs at least 2 PDFs.';
    if (v.operation === 'watermark' && !String(v.text || '').trim()) return 'Enter the watermark text.';
    if (v.operation === 'split' && v.mode === 'ranges' && !String(v.ranges || '').trim()) return 'Enter page ranges, e.g. 1-3,5.';
  }
  if (t.id === 'redact' && !(v.types || []).length && !String(v.custom_regex || '').trim() && !String(v.terms || '').trim())
    return 'Pick at least one PII type, or add a pattern / words to remove.';
  return null;
}
function buildForm(t, st) {
  const fd = new FormData(), opts = {};
  for (const f of t.fields) {
    if (f.show && !f.show(st.vals)) continue;
    let v = st.vals[f.name];
    if (f.type === 'chips') v = (v || []).join(',');
    if (f.type === 'check') v = !!v;
    else if ((v === '' || v == null) && !f.sendEmpty) continue;
    if (f.opt) opts[f.name] = f.type === 'number' ? Number(v) : v;
    else fd.append(f.name, f.type === 'check' ? (v ? 'true' : 'false') : String(v));
  }
  if (t.id === 'batch') fd.append('options', JSON.stringify(opts));
  t.slots.forEach(s => (st.files[s.key] || []).forEach(f => fd.append(s.key, f, f.name)));
  return fd;
}
async function run(id) {
  const t = byId[id], st = S[id];
  if (st.busy) return;
  const problem = validate(t, st);
  if (problem) { st.err = problem; return paintStatus(t, st); }
  st.busy = true; st.err = null; st.out = '';
  setProg(id, 0, 'Uploading…', false);
  try {
    const res = await post(`/api/${id}`, buildForm(t, st), (p, done) =>
      done ? setProg(id, 100, t.async ? 'Starting…' : 'Processing…', true) : setProg(id, Math.round(p * 100), `Uploading ${Math.round(p * 100)}%`, false));
    st.out = t.render(t.async ? await poll(id, res.job_id) : res);
  } catch (e) { st.err = e.message || 'Something went wrong'; }
  finally { st.busy = false; st.prog = null; paintStatus(t, st); }
}

/* ───────── boot ───────── */
async function boot() {
  try { const r = await (await fetch('/api/config')).json(); if (r.ok) CFG = {...CFG, ...r}; } catch (_) {}
  TOOLS.forEach(t => {
    const vals = {};
    t.fields.forEach(f => {
      const o = typeof f.opts === 'function' ? f.opts() : f.opts;
      vals[f.name] = f.def === 'all' ? o.map(x => x[0]) : f.def ?? (f.type === 'chips' ? [] : f.type === 'check' ? false : '');
    });
    S[t.id] = {files: {}, vals, busy: false, prog: null, err: null, out: ''};
  });
  $('#rail').innerHTML = TOOLS.map(t => `<button class="tab" data-id="${t.id}" aria-current="false"><span class="n">${t.n}</span><span><b>${esc(t.name)}</b><small>${esc(t.cap)}</small></span></button>`).join('');
  $('#rail').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) location.hash = b.dataset.id; });
  $('#quota').textContent = CFG.free_daily_limit ? `Free · ${CFG.free_daily_limit} runs / day` : 'Free tier';
  $('#ttl').textContent = `Uploads and results are deleted automatically after ${CFG.ttl_minutes} min.`;
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
}
boot();
})();
</script>
</body>
</html>
